<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wonderland Online — NPC Shop Guide</title>
  <style>
    :root {
      --bg:        #0d0f1a;
      --surface:   #151827;
      --card:      #1c2035;
      --border:    #2a304d;
      --accent:    #7c5cfc;
      --accent2:   #e8a838;
      --text:      #d4daf5;
      --muted:     #6b7399;
      --tag-bg:    #252c4a;
      --tag-text:  #a9b4e8;
      --radius:    14px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #10122080 0%, #1a1040cc 100%),
                  url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%237c5cfc' fill-opacity='0.06'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      border-bottom: 1px solid var(--border);
      padding: 2.5rem 1.5rem 2rem;
      text-align: center;
    }

    header h1 {
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #a78bfa, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      margin-top: 0.5rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* ── Search ── */
    .controls {
      max-width: 900px;
      margin: 1.8rem auto 0;
      padding: 0 1rem;
    }

    .search-wrap {
      position: relative;
    }

    .search-wrap svg {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    #search {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color .2s;
    }

    #search::placeholder { color: var(--muted); }
    #search:focus { border-color: var(--accent); }

    /* ── Grid ── */
    main {
      max-width: 1100px;
      margin: 2rem auto 4rem;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.2rem;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.4rem 1.4rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      transition: transform .18s, border-color .18s, box-shadow .18s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 8px 32px #7c5cfc28;
    }

    .card.hidden { display: none; }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .city-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #4f3bc0);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .city-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #e8ecff;
    }

    .city-note {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 1px;
    }

    .items-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .tag {
      background: var(--tag-bg);
      color: var(--tag-text);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 0.25rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .tag .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    /* ── Empty state ── */
    #empty {
      display: none;
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--muted);
    }

    #empty svg { margin-bottom: 1rem; opacity: .4; }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--muted);
      font-size: 0.78rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<header>
  <h1>⚔️ Wonderland Online — NPC Shop Guide</h1>
  <p>Find out what each city's NPC sells at a glance.</p>

  <div class="controls">
    <div class="search-wrap">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
           viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="search" type="search" placeholder="Search city or item…" autocomplete="off" />
    </div>
  </div>
</header>

<main id="grid">
  <!-- Cards are injected by JS -->
  <div id="empty">
    <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <p>No cities match your search.</p>
  </div>
</main>

<footer>
  Wonderland Online NPC Guide &nbsp;·&nbsp; Last updated April 2026
</footer>

<script>
  // ─────────────────────────────────────────────────────────────────
  //  DATA — add / remove / edit entries here as the game changes
  //
  //  Each entry:
  //    city   : display name
  //    icon   : any emoji that fits the city feel
  //    note   : optional subtitle (e.g. location hint)
  //    sells  : array of item strings
  // ─────────────────────────────────────────────────────────────────
  const CITIES = [
    {
      city: "Kelan",
      icon: "🏚️",
      note: "",
      sells: ["Clay"]
    },
    {
      city: "Welling",
      icon: "🌲",
      note: "",
      sells: ["Woods"]
    },
    {
      city: "Holy",
      icon: "⛪",
      note: "",
      sells: ["Ores"]
    },
    {
      city: "Rome",
      icon: "🏛️",
      note: "",
      sells: ["Flowers"]
    },
    {
      city: "Korea",
      icon: "🏯",
      note: "",
      sells: ["Cottons"]
    },
    {
      city: "China",
      icon: "🀄",
      note: "Inside house",
      sells: ["Dyes"]
    },
    {
      city: "Chang An",
      icon: "🔮",
      note: "",
      sells: ["White Crystals", "Ruby"]
    },
    {
      city: "Cornwall",
      icon: "🐄",
      note: "",
      sells: ["Leathers"]
    },
    {
      city: "Mayan",
      icon: "🗿",
      note: "",
      sells: ["White Silveries", "Bluestone"]
    },
    {
      city: "South Pole",
      icon: "🧊",
      note: "",
      sells: ["Furs", "Skins"]
    },
    {
      city: "Persia",
      icon: "🪬",
      note: "",
      sells: ["Jades"]
    },
    {
      city: "Bangkok",
      icon: "⚗️",
      note: "",
      sells: ["Sulfur", "Sealed Potion"]
    },
  ];

  // ── Render ──────────────────────────────────────────────────────
  const grid  = document.getElementById('grid');
  const empty = document.getElementById('empty');

  function buildCards() {
    CITIES.forEach((entry, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.idx = idx;

      const tags = entry.sells
        .map(item => `<span class="tag"><span class="dot"></span>${item}</span>`)
        .join('');

      card.innerHTML = `
        <div class="card-header">
          <div class="city-icon">${entry.icon}</div>
          <div>
            <div class="city-name">${entry.city}</div>
            ${entry.note ? `<div class="city-note">${entry.note}</div>` : ''}
          </div>
        </div>
        <div class="items-list">${tags}</div>
      `;

      grid.insertBefore(card, empty);
    });
  }

  // ── Search ──────────────────────────────────────────────────────
  document.getElementById('search').addEventListener('input', function () {
    const q = this.value.trim().toLowerCase();
    const cards = grid.querySelectorAll('.card');
    let visible = 0;

    cards.forEach((card, i) => {
      const entry = CITIES[i];
      const haystack = [entry.city, entry.note, ...entry.sells].join(' ').toLowerCase();
      const match = !q || haystack.includes(q);
      card.classList.toggle('hidden', !match);
      if (match) visible++;
    });

    empty.style.display = visible === 0 ? 'block' : 'none';
  });

  buildCards();
</script>
</body>
</html>
